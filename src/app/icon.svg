<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ApexSMC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#212631"/>
      <stop offset="1" stop-color="#0F1117"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2563EB" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Bullish candles climbing into the Apex, then the bearish rejection -->
  <g stroke="#4CAF88" stroke-width="2.5" stroke-linecap="round">
    <line x1="18.5" y1="40" x2="18.5" y2="49"/>
    <line x1="31.5" y1="30" x2="31.5" y2="45"/>
  </g>
  <rect x="14" y="34" width="9" height="8" rx="1.5" fill="#4CAF88"/>
  <rect x="27" y="24" width="9" height="14" rx="1.5" fill="#4CAF88"/>

  <g stroke="#E05C64" stroke-width="2.5" stroke-linecap="round">
    <line x1="44.5" y1="13" x2="44.5" y2="36"/>
  </g>
  <rect x="40" y="16" width="9" height="14" rx="1.5" fill="#E05C64"/>

  <!-- Structural support line -->
  <line x1="12" y1="52" x2="52" y2="52" stroke="#2563EB" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
</svg>
